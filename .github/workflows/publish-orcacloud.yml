# Publishes the plugin to Orca Cloud when a GitHub release with the tag
# v<version> is published (version = "# version" in spoolman_profiles.py).
#
# One-time setup (by the repo owner):
#   1. Create the plugin in Orca Cloud with your account and allow this GitHub
#      repository to publish releases for it.
#   2. GitHub: Settings > Secrets and variables > Actions > Variables:
#      ORCACLOUD_PUBLISH = true
#
# The release text becomes the changelog OrcaSlicer shows; if it is empty, the
# version's section from CHANGELOG.md is used. The plugin description is not part
# of a release: paste orcacloud/description.md on the plugin page in Orca Cloud.

name: Publish plugin to Orca Cloud

on:
  release:
    types: [published]

permissions:
  id-token: write   # GitHub OIDC token, Orca Cloud checks it instead of a stored secret
  contents: read

jobs:
  publish:
    if: vars.ORCACLOUD_PUBLISH == 'true' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check version and build the plugin files
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python build.py --tag "$TAG" --changelog-out changelog_file.md

      - name: Publish release to Orca Cloud
        run: |
          set -euo pipefail
          tag="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
          version="${tag#v}"
          # Orca Cloud shows the changelog as plain text: use the release text if there is
          # one, else the CHANGELOG.md section, both without Markdown marks.
          jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" > release_body.md
          if [ -n "$(tr -d '[:space:]' < release_body.md)" ]; then
            python build.py --plain release_body.md changelog_file.md
          fi
          changelog="$(head -c 4000 changelog_file.md)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version, changelog: $changelog}')"
          args=(--form-string "metadata=$metadata")
          for file in dist/*.py; do
            args+=(-F "files=@$file")
          done
          # Orca Cloud answers EDIT_CONFLICT while the plugin is being changed (e.g. its
          # review or an edit on the plugin page): wait and try again, like 5xx errors.
          for attempt in 1 2 3; do
            oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
            status="$(curl -sS --max-time 300 -o response.json -w '%{http_code}' \
              -H "Authorization: Bearer $oidc_token" \
              "${args[@]}" \
              https://api.orcaslicer.com/api/v1/plugin-publish/releases)" || status="000"
            echo "attempt $attempt: HTTP $status"
            cat response.json 2>/dev/null || true
            echo
            [ "$status" = "201" ] && exit 0
            if grep -q '"EDIT_CONFLICT"' response.json 2>/dev/null || [ "${status:0:1}" = "5" ] || [ "$status" = "000" ]; then
              [ "$attempt" -lt 3 ] && { echo "retrying in 60 s"; sleep 60; }
              continue
            fi
            exit 1
          done
          exit 1
